<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- makes the page to fit on phone screen-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NYC Urban Mobility Explorer</title>
    </head>
    <body>
        <!-- the title -->
        <header>
            <h1>NYC Urban Mobility Explorer</h1>
            <p>How New Yorkers move by taxi</p>
        </header>
        <main>
            <!-- filter panel-->
            <section id="filters">
                <h2>Filters</h2>

                <!-- date range -->
                 <label for="date-from">From date</label>
                 <input type="date" id="date-from">

                 <label for="date-to">To date</label>
                 <input type="date" id="date-to">

                 <!--location: filter by the borough where the trip started-->
                 <label for="borough">Pickup borough</label>
                 <select id="borough">
                    <option value="">All</option>
                    <option value="Manhattan">Manhattan</option>
                    <option value="Brooklyn">Brooklyn</option>
                    <option value="Queens">Queens</option>
                    <option value="Bronx">Bronx</option>
                    <option value="Staten Island">Staten Island</option>
                 </select>  

                 <!-- fare range dollars -->
                  <label for="min-fare">Min fare ($)</label>
                  <input type="number" id="min-fare" min="0">
                  
                  <label for="max-fare">Max fare ($)</label>
                  <input type="number" id="max-fare" min="0">

                 <!-- distance range in miles -->
                 <label for="min-distance">Min distance (miles)</label>
                <input type="number" id="min-distance" min="0">

                <label for="max-distance">Max distance (miles)</label>
                <input type="number" id="max-distance" min="0">

                <!-- apply sends the choices to the page, reset clears them -->
                <button id="apply-btn">Apply</button>
                <button id="reset-btn">Reset</button>
            </section>

                <!-- three number cards that summarize the trips-->
                 <section id="summary">
                    <div class="card">
                        <h3>Total trips</h3>
                        <p id="total-trips">-</p>
                        </div>
                        <div class="card">
                            <h3>Average fare</h3>
                            <p id="avg-fare">-</p>
                        </div>
                        <div class="card">
                            <h3>Average speed</h3>
                            <p id="avg-speed">-</p>
                    </div>
                 </section>

                 <!-- spaces where the charts will be drawn-->
                  <section id="charts">
                  <h2>Patterns</h2>

                  <div class="chart-box">
                    <h3>Trips by hour</h3>
                    <canvas id="hour-chart"></canvas>
                  </div>

                  <div class="chart-box">
                    <h3>Average speed by hour</h3>
                    <canvas id="speed-chart"></canvas>
                  </div>

                  <div class="chart-box">
                    <h3>Fare per mile by borough</h3>
                    <canvas id="fare-chart"></canvas>
                  </div>
            </section>

            <!-- table of individual trips, headers will be used for sorting -->
            <section id="table-section">
                <h2>Trips</h2>
                <table id="trips-table">
                    <thead>
                        <tr>
                            <th data-sort="pickup_datetime">Pickup time</th>
                            <th data-sort="pu_zone">Pickup zone</th>
                            <th data-sort="do_zone">Dropoff zone</th>
                            <th data-sort="trip_distance_miles">Distance (mi)</th>
                            <th data-sort="trip_duration_min">Duration (min)</th>
                            <th data-sort="fare_amount">Fare ($)</th>
                        </tr>
                    </thead>
                    <tbody id="trips-body">
                    </tbody>
                </table>
            </section>

            <!-- map of the taxi zones -->
            <section id="map-section">
                <h2>Taxi zones map</h2>
                <div id="map"></div>
            </section>
        </main>
    </body>
</html>
