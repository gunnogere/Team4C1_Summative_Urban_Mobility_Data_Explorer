<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- makes the page to fit on phone screen-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NYC Urban Mobility Explorer</title>
    </head>
    <body>
        <!-- the title -->
        <header>
            <h1>NYC Urban Mobility Explorer</h1>
            <p>How New Yorkers move by taxi</p>
        </header>
        <main>
            <!-- filter panel-->
            <section id="filters">
                <h2>Filters</h2>

                <!-- date range -->
                 <label for="date-from">From date</label>
                 <input type="date" id="date-from">

                 <label for="date-to">To date</label>
                 <input type="date" id="date-to">

                 <!--location: filter by the borough where the trip started-->
                 <label for="borough">Pickup borough</label>
                 <select id="borough">
                    <option value="">All</option>
                    <option value="Manhattan">Manhattan</option>
                    <option value="Brooklyn">Brooklyn</option>
                    <option value="Queens">Queens</option>
                    <option value="Bronx">Bronx</option>
                    <option value="Staten Island">Staten Island</option>
                 </select>  

                 <!-- fare range dollars -->
                  <label for="min-fare">Min fare ($)</label>
                  <input type="number" id="min-fare" min="0">
                  
                  <label for="max-fare">Max fare ($)</label>
                  <input type="number" id="max-fare" min="0">

                 <!-- distance range in miles -->
                 <label for="min-distance">Min distance (miles)</label>
                <input type="number" id="min-distance" min="0">

                <label for="max-distance">Max distance (miles)</label>
                <input type="number" id="max-distance" min="0">

                <!-- apply sends the choices to the page, reset clears them -->
                <button id="apply-btn">Apply</button>
                <button id="reset-btn">Reset</button>

            </section>
        </main>
    </body>
</html>
